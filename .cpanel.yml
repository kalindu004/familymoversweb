---
# cPanel Git deployment for test.familymovers.lk
# https://go.cpanel.net/GitDeployment
# Copies only the site files listed below. Do not use * — that would copy .git.
# If File Manager shows a different document root for the subdomain, change DEPLOYPATH.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/test.familymovers.lk
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R images $DEPLOYPATH
